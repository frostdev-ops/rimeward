# Rimeward server: a prebuilt release tarball (+ SHA256SUMS) and a ghcr.io
# image per `vX.Y.Z` tag — what `rimeward update` and `docker compose pull`
# install. Published straight away: the same job type-checked, tested and
# built the exact bytes it uploads.
name: Rimeward server

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Version
        id: v
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match package.json v$version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stamp=v$version ${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build
        env:
          PUBLIC_APP_BUILD: ${{ steps.v.outputs.stamp }}

      - name: Pack
        shell: bash
        run: |
          name=rimeward-server-v${{ steps.v.outputs.version }}
          tar -czf "$name.tar.gz" dist src public migrations assets workers bin \
            package.json package-lock.json server.mjs astro.config.mjs tsconfig.json compose.yaml Dockerfile
          sha256sum "$name.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Image
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build --build-arg PUBLIC_APP_BUILD="${{ steps.v.outputs.stamp }}" \
            -t "$image:${{ steps.v.outputs.version }}" -t "$image:latest" .
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then docker push --all-tags "$image"; fi

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Rimeward server v${{ steps.v.outputs.version }}" --generate-notes \
            "rimeward-server-v${{ steps.v.outputs.version }}.tar.gz" SHA256SUMS
