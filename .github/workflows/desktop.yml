# Rimeward (desktop/): signed + notarized macOS DMG, Windows and Linux
# bundles, attached to a GitHub Release. Tag `desktop-vX.Y.Z` to run it.
#
# Secrets (repo settings → Secrets → Actions):
#   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   its password
#   APPLE_SIGNING_IDENTITY       "Developer ID Application: Name (TEAMID)"
#   APPLE_API_ISSUER             App Store Connect API issuer id
#   APPLE_API_KEY                App Store Connect API key id
#   APPLE_API_KEY_B64            base64 of the AuthKey_<id>.p8 file
name: Rimeward desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      validation_only:
        description: Build and check every platform without publishing installers
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Verify release tag matches this build
        if: github.event_name == 'push' || !inputs.validation_only
        shell: bash
        run: |
          tag=$(node -p "'desktop-v' + require('./desktop/tauri.conf.json').version")
          git fetch --depth=1 origin "refs/tags/$tag"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev xvfb python3-venv python3-distro

      - name: Bundle standalone runtime
        run: node desktop/prebuild.mjs

      - name: Sign nested macOS runtime code
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          signing_dir=$(mktemp -d)
          export RIMEWARD_SIGNING_KEYCHAIN="$signing_dir/runtime.keychain-db"
          signing_password=$(openssl rand -hex 24)
          trap 'security delete-keychain "$RIMEWARD_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; rm -rf "$signing_dir"' EXIT
          signing_keychains=()
          while IFS= read -r keychain; do signing_keychains+=("$keychain"); done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$signing_dir/certificate.p12"
          security create-keychain -p "$signing_password" "$RIMEWARD_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$RIMEWARD_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$signing_password" "$RIMEWARD_SIGNING_KEYCHAIN"
          security import "$signing_dir/certificate.p12" -k "$RIMEWARD_SIGNING_KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$RIMEWARD_SIGNING_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "${signing_keychains[@]}" "$RIMEWARD_SIGNING_KEYCHAIN"
          security find-identity -v -p codesigning "$RIMEWARD_SIGNING_KEYCHAIN"
          node desktop/sign-runtime.mjs

      - name: Desktop lint and native tests
        run: npm run desktop:check

      - name: Runtime validation
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/desktop/runtime/browsers
        run: npm run typecheck && npm test && node tests/standalone-smoke.mjs

      - name: Bundled remote media validation
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/desktop/runtime/browsers
          RIMEWARD_MEDIA_SDK: ${{ github.workspace }}/desktop/runtime/media
          RIMEWARD_MEDIA_VIEWERS: 4
          RIMEWARD_MEDIA_FAULTS: 1
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            export RIMEWARD_MEDIA_HELPER="$RIMEWARD_MEDIA_SDK/rimeward-media.exe"
          else
            export RIMEWARD_MEDIA_HELPER="$RIMEWARD_MEDIA_SDK/rimeward-media"
          fi
          node tests/remote-media-smoke.mjs

      - name: Validate native application build
        if: github.event_name == 'workflow_dispatch' && inputs.validation_only
        working-directory: desktop
        run: npx tauri build --no-bundle ${{ matrix.args }}

      - name: App Store Connect key
        if: startsWith(matrix.platform, 'macos-') && (github.event_name == 'push' || !inputs.validation_only)
        run: echo "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}

      - uses: tauri-apps/tauri-action@v1
        if: github.event_name == 'push' || !inputs.validation_only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Finder can hold the mounted installer open on hosted macOS runners.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          projectPath: desktop
          tauriScript: npx tauri
          tagName: desktop-v__VERSION__
          releaseName: Rimeward desktop-v__VERSION__
          releaseBody: Download the macOS DMG, Windows installer, or Linux DEB/AppImage for your platform below.
          # The existing tag was verified above. This avoids workflow-scope
          # restrictions when the default branch advances during a long build.
          releaseCommitish: ${{ github.event.repository.default_branch }}
          releaseDraft: true
          prerelease: false
          args: --verbose ${{ matrix.args }}

  publish:
    needs: build
    if: github.event_name == 'push' || !inputs.validation_only
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish completed desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -p "'desktop-v' + require('./desktop/tauri.conf.json').version")
          gh release edit "$tag" --draft=false --latest
