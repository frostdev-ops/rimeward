# Rimeward (desktop/): signed + notarized macOS DMG, Windows and Linux
# bundles, attached to a draft GitHub Release. Tag `desktop-vX.Y.Z` to run it.
# Publish manually after all packaged-runtime checks pass; installed GUI acceptance is separate.
# Push main or dev/<version> branches to run the same checks and native builds without a release.
#
# Secrets (repo settings → Secrets → Actions):
#   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   its password
#   APPLE_SIGNING_IDENTITY       "Developer ID Application: Name (TEAMID)"
#   APPLE_API_ISSUER             App Store Connect API issuer id
#   APPLE_API_KEY                App Store Connect API key id
#   APPLE_API_KEY_B64            base64 of the AuthKey_<id>.p8 file
#   TAURI_SIGNING_PRIVATE_KEY    the updater's minisign private key (tauri signer generate);
#                                its public half is plugins.updater.pubkey in tauri.conf.json
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty when the key has none)
#
# Publishing the draft release is what makes the update visible: the app's
# updater reads latest.json from the newest PUBLISHED desktop-v* release.
name: Rimeward desktop

on:
  push:
    branches: [main, 'dev/**']
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      validation_only:
        description: Build and check every platform without publishing installers
        type: boolean
        default: true
      platform:
        description: Validation target (release builds always use every platform)
        type: choice
        default: all
        options: [all, macos-latest, ubuntu-24.04, windows-latest]
      audit_release_tag:
        description: Audit an existing immutable desktop release instead of building
        type: string
        default: ''
      audit_dmg_sha256:
        description: Expected SHA256 of that release's macOS DMG
        type: string
        default: ''

# A newer run of the same ref supersedes the one in flight.
concurrency:
  group: desktop-${{ github.ref }}-${{ (inputs.audit_release_tag || inputs.audit_dmg_sha256) && format('audit-{0}', inputs.audit_release_tag) || 'build' }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.audit_release_tag && !inputs.audit_dmg_sha256 }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.validation_only && inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["macos-latest","ubuntu-24.04","windows-latest"]') }}
    # The matrix value stays `macos-latest` so every `matrix.platform` condition
    # below reads the same, but the macOS job runs on the `xcode-27` preview
    # image: the only hosted runner with the macOS 27 SDK and Swift 6.x that
    # desktop/lens-helper needs. If that label queues forever or disappears,
    # drop the mapping (back to `matrix.platform`) and set RIMEWARD_SKIP_LENS=1
    # on this job — the app then ships without the lens helper and its models,
    # and every `helper-*` op answers `unavailable`.
    runs-on: ${{ matrix.platform == 'macos-latest' && 'xcode-27' || matrix.platform }}
    # A hung notarization or download fails the job instead of holding a runner for six hours.
    timeout-minutes: 150
    env:
      TAURI_BUILD_ARGS: ${{ matrix.platform == 'macos-latest' && '--target aarch64-apple-darwin' || '' }}
      # The updater artifacts are signed at bundle time (validation builds too).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # The GStreamer SDK (media-runtime.mjs): restored from the cache below, so
      # a warm run skips the downloads and, on Linux, the from-source build.
      RIMEWARD_MEDIA_CACHE: ${{ github.workspace }}/.cache/media-sdk
      # The lens helper's MobileCLIP-S0 text tower (desktop/models.mjs): 85 MB
      # fetched once and restored from the cache below.
      RIMEWARD_MODELS_CACHE: ${{ github.workspace }}/.cache/lens-models
      RIMEWARD_OCR_CACHE: ${{ github.workspace }}/.cache/portable-ocr
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Verify release tag and promotion to main
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && !inputs.validation_only)
        shell: bash
        run: |
          tag=$(node -p "'desktop-v' + require('./desktop/tauri.conf.json').version")
          test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = "$tag"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Identify Xcode for Rust cache
        if: startsWith(matrix.platform, 'macos-')
        id: xcode
        shell: bash
        run: |
          developer_dir=$(realpath "$(xcode-select -p)")
          xcode_version=$(xcodebuild -version)
          printf '%s\n%s\n' "$developer_dir" "$xcode_version" |
            shasum -a 256 | awk '{ print "key=" $1 }' >> "$GITHUB_OUTPUT"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop
            desktop/media-helper
          # Native dependencies retain absolute Xcode SDK and Swift library paths.
          key: ${{ steps.xcode.outputs.key }}

      - name: Cache the media SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.RIMEWARD_MEDIA_CACHE }}/sdk
          key: media-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/media-runtime.mjs') }}

      - name: Cache the lens models
        if: startsWith(matrix.platform, 'macos-')
        uses: actions/cache@v4
        with:
          path: ${{ env.RIMEWARD_MODELS_CACHE }}
          key: lens-models-${{ hashFiles('desktop/models.mjs') }}

      - name: Cache pinned portable OCR builds
        if: matrix.platform != 'macos-latest'
        uses: actions/cache@v4
        with:
          path: ${{ env.RIMEWARD_OCR_CACHE }}
          key: portable-ocr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/ocr-runtime.mjs') }}

      - name: Linux build deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev xvfb python3-venv python3-distro

      - name: Bundle standalone runtime
        run: node desktop/prebuild.mjs

      - name: Allow bundled Chromium's sandbox on the Ubuntu runner
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          chromium=$(node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath())")
          sudo tee /etc/apparmor.d/rimeward-ci-chromium >/dev/null <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile rimeward-ci-chromium "$chromium" flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/rimeward-ci-chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/desktop/runtime/browsers

      - name: Sign nested macOS runtime code
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          signing_dir=$(mktemp -d)
          export RIMEWARD_SIGNING_KEYCHAIN="$signing_dir/runtime.keychain-db"
          signing_password=$(openssl rand -hex 24)
          trap 'security delete-keychain "$RIMEWARD_SIGNING_KEYCHAIN" >/dev/null 2>&1 || true; rm -rf "$signing_dir"' EXIT
          signing_keychains=()
          while IFS= read -r keychain; do signing_keychains+=("$keychain"); done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          printf '%s' "$APPLE_CERTIFICATE" | base64 -d > "$signing_dir/certificate.p12"
          security create-keychain -p "$signing_password" "$RIMEWARD_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$RIMEWARD_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$signing_password" "$RIMEWARD_SIGNING_KEYCHAIN"
          security import "$signing_dir/certificate.p12" -k "$RIMEWARD_SIGNING_KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$RIMEWARD_SIGNING_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "${signing_keychains[@]}" "$RIMEWARD_SIGNING_KEYCHAIN"
          security find-identity -v -p codesigning "$RIMEWARD_SIGNING_KEYCHAIN"
          node desktop/sign-runtime.mjs

      - name: Desktop lint and native tests
        env:
          RUST_BACKTRACE: '1'
        run: npm run desktop:check

      - name: Runtime validation
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/desktop/runtime/browsers
        run: npm run typecheck && npm test && node tests/standalone-smoke.mjs

      - name: Validate bundled portable OCR
        if: matrix.platform != 'macos-latest'
        run: node tests/portable-ocr-smoke.mjs desktop/runtime/ocr

      - name: Bundled remote media validation
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/desktop/runtime/browsers
          RIMEWARD_MEDIA_SDK: ${{ github.workspace }}/desktop/runtime/media
          RIMEWARD_MEDIA_VIEWERS: 4
          RIMEWARD_MEDIA_FAULTS: 1
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            export RIMEWARD_MEDIA_HELPER="$RIMEWARD_MEDIA_SDK/rimeward-media.exe"
          else
            export RIMEWARD_MEDIA_HELPER="$RIMEWARD_MEDIA_SDK/rimeward-media"
          fi
          node tests/remote-media-smoke.mjs

      - name: Validate native application build
        if: github.ref_type != 'tag' || inputs.validation_only
        working-directory: desktop
        env:
          # Branch apps exercise packaging without importing release notarization credentials.
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        run: npx tauri build ${{ matrix.platform == 'ubuntu-24.04' && '--bundles deb,appimage' || matrix.platform == 'windows-latest' && '--bundles nsis,msi' || '--bundles app' }} ${{ env.TAURI_BUILD_ARGS }}

      - name: Save validation installer
        if: matrix.platform == 'windows-latest' && (github.ref_type != 'tag' || inputs.validation_only)
        uses: actions/upload-artifact@v4
        with:
          name: rimeward-windows-${{ github.sha }}
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: App Store Connect key
        if: startsWith(matrix.platform, 'macos-') && github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.validation_only)
        run: echo "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}

      - uses: tauri-apps/tauri-action@v1
        if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.validation_only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Finder can hold the mounted installer open on hosted macOS runners.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          projectPath: desktop
          tauriScript: npx tauri
          tagName: desktop-v__VERSION__
          releaseName: Rimeward desktop-v__VERSION__
          releaseBody: Download the macOS DMG, Windows installer, or Linux DEB/AppImage for your platform below. Installed copies offer this version from their tray menu once the release is published.
          # The existing tag was verified above. This avoids workflow-scope
          # restrictions when the default branch advances during a long build.
          releaseCommitish: ${{ github.event.repository.default_branch }}
          releaseDraft: true
          prerelease: false
          # latest.json + the .sig files: what the in-app updater reads.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: --verbose ${{ env.TAURI_BUILD_ARGS }}

      - name: Validate packaged macOS runtime and signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          RELEASE_BUILD: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.validation_only) }}
        run: |
          package_dir=$(mktemp -d)
          mounted=false
          trap 'if $mounted; then hdiutil detach "$package_dir/mount"; fi; rm -rf "$package_dir"' EXIT
          app=desktop/target/aarch64-apple-darwin/release/bundle/macos/Rimeward.app
          if [[ "$RELEASE_BUILD" == true ]]; then
            dmg=$(find desktop/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print)
            hdiutil verify "$dmg"
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$package_dir/mount"
            mounted=true
            app="$package_dir/mount/Rimeward.app"
          fi
          codesign --verify --deep --strict "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$version" = "$(node -p "require('./desktop/tauri.conf.json').version")"
          if [[ "$RELEASE_BUILD" == true ]]; then
            codesign -dv --verbose=2 "$app" 2>&1 | grep '^Authority=Developer ID Application:'
            spctl --assess --type execute --verbose=2 "$app"
          fi
          packaged_runtime="$app/Contents/Resources/runtime"
          node tests/standalone-smoke.mjs "$packaged_runtime" "$app/Contents/MacOS/rimeward-node"
          RIMEWARD_MEDIA_SDK="$packaged_runtime/media" \
            RIMEWARD_MEDIA_HELPER="$packaged_runtime/media/rimeward-media" \
            PLAYWRIGHT_BROWSERS_PATH="$packaged_runtime/browsers" \
            RIMEWARD_MEDIA_VIEWERS=4 RIMEWARD_MEDIA_FAULTS=1 \
            node tests/remote-media-smoke.mjs

      - name: Validate packaged Windows runtimes
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $msi = @(Get-ChildItem desktop/target/release/bundle/msi/*.msi)
          if ($msi.Count -ne 1) { throw 'Expected one MSI installer' }
          $installers += $msi
          foreach ($installer in $installers) {
            $packageDir = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
            New-Item -ItemType Directory $packageDir | Out-Null
            try {
              if ($installer.Extension -eq '.msi') {
                $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/a `"$($installer.FullName)`" /qn TARGETDIR=`"$packageDir`""
                if ($process.ExitCode -notin 0, 3010) { throw "MSI extraction failed: $($process.ExitCode)" }
              } else {
                & 7z x $installer.FullName "-o$packageDir" -y | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "NSIS extraction failed: $LASTEXITCODE" }
              }
              $metadata = @(Get-ChildItem $packageDir -Filter runtime.json -Recurse)
              if ($metadata.Count -ne 1) { throw 'Expected one packaged runtime' }
              $runtime = $metadata[0].Directory.FullName
              $node = Join-Path (Split-Path $runtime) 'rimeward-node.exe'
              if (-not (Test-Path $node)) { throw 'Packaged Node must be beside the application runtime directory' }
              & node tests/standalone-smoke.mjs $runtime $node
              if ($LASTEXITCODE -ne 0) { throw 'Packaged standalone smoke failed' }
              & node tests/portable-ocr-smoke.mjs (Join-Path $runtime 'ocr')
              if ($LASTEXITCODE -ne 0) { throw 'Packaged portable OCR smoke failed' }
              $env:RIMEWARD_MEDIA_SDK = Join-Path $runtime 'media'
              $env:RIMEWARD_MEDIA_HELPER = Join-Path $env:RIMEWARD_MEDIA_SDK 'rimeward-media.exe'
              $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $runtime 'browsers'
              $env:RIMEWARD_MEDIA_VIEWERS = '4'
              $env:RIMEWARD_MEDIA_FAULTS = '1'
              & node tests/remote-media-smoke.mjs
              if ($LASTEXITCODE -ne 0) { throw 'Packaged remote media smoke failed' }
            } finally {
              Remove-Item -Recurse -Force $packageDir
            }
          }

      - name: Validate packaged Linux runtime
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          for installer in desktop/target/release/bundle/deb/*.deb desktop/target/release/bundle/appimage/*.AppImage; do
            package_dir=$(mktemp -d)
            trap 'rm -rf "$package_dir"' EXIT
            if [[ "$installer" == *.deb ]]; then
              dpkg-deb --extract "$installer" "$package_dir"
              package_root="$package_dir"
            else
              appimage=$(realpath "$installer")
              (cd "$package_dir" && "$appimage" --appimage-extract >/dev/null)
              package_root="$package_dir/squashfs-root"
            fi
            packaged_runtime="$package_root/usr/share/Rimeward/runtime"
            # Check the shipped bytes: packagers must not rewrite private libraries.
            diff -qr desktop/runtime "$packaged_runtime"
            node tests/standalone-smoke.mjs "$packaged_runtime" "$package_root/usr/bin/rimeward-node"
            node tests/portable-ocr-smoke.mjs "$packaged_runtime/ocr"
            RIMEWARD_MEDIA_SDK="$packaged_runtime/media" \
              RIMEWARD_MEDIA_HELPER="$packaged_runtime/media/rimeward-media" \
              PLAYWRIGHT_BROWSERS_PATH="$packaged_runtime/browsers" \
              RIMEWARD_MEDIA_VIEWERS=4 RIMEWARD_MEDIA_FAULTS=1 \
              node tests/remote-media-smoke.mjs
            rm -rf "$package_dir"
          done

  audit-release:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.audit_release_tag || inputs.audit_dmg_sha256) }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      # GitHub exposes draft releases only to tokens with push access.
      contents: write
    env:
      AUDIT_RELEASE_TAG: ${{ inputs.audit_release_tag }}
      AUDIT_DMG_SHA256: ${{ inputs.audit_dmg_sha256 }}
    steps:
      - name: Validate audit inputs
        shell: bash
        run: |
          [[ "$AUDIT_RELEASE_TAG" =~ ^desktop-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid desktop release tag' >&2; exit 1; }
          [[ "$AUDIT_DMG_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || { echo 'Expected a 64-digit DMG SHA256' >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.AUDIT_RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm

      - name: Verify immutable tag and promotion to main
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          test "$revision" = "$(git rev-parse "refs/tags/$AUDIT_RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$revision" origin/main
          tag=$(node -p "'desktop-v' + require('./desktop/tauri.conf.json').version")
          test "$AUDIT_RELEASE_TAG" = "$tag"
          printf 'Auditing %s at %s\n' "$AUDIT_RELEASE_TAG" "$revision"

      - run: npm ci

      - name: Validate immutable DMG runtime and signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_dir=$(mktemp -d)
          mounted=false
          trap 'if $mounted; then hdiutil detach "$package_dir/mount"; fi; rm -rf "$package_dir"' EXIT
          version=$(node -p "require('./desktop/tauri.conf.json').version")
          asset="Rimeward_${version}_aarch64.dmg"
          gh release download "$AUDIT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$package_dir"
          dmg="$package_dir/$asset"
          printf '%s  %s\n' "$AUDIT_DMG_SHA256" "$dmg" | shasum -a 256 --check
          printf 'Verified DMG SHA256: %s\n' "$AUDIT_DMG_SHA256"
          hdiutil verify "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$package_dir/mount"
          mounted=true
          app="$package_dir/mount/Rimeward.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          codesign -dv --verbose=2 "$app" 2>&1 | grep '^Authority=Developer ID Application:'
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          packaged_runtime="$app/Contents/Resources/runtime"
          node tests/standalone-smoke.mjs "$packaged_runtime" "$app/Contents/MacOS/rimeward-node"
          RIMEWARD_MEDIA_SDK="$packaged_runtime/media" \
            RIMEWARD_MEDIA_HELPER="$packaged_runtime/media/rimeward-media" \
            PLAYWRIGHT_BROWSERS_PATH="$packaged_runtime/browsers" \
            RIMEWARD_MEDIA_VIEWERS=4 RIMEWARD_MEDIA_FAULTS=1 \
            node tests/remote-media-smoke.mjs
