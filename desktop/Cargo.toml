[package]
name = "rimeward"
version = "0.4.10"
edition = "2021"
rust-version = "1.84"
description = "Rimeward — standalone development workspaces with live remote access"

# The lib/bin split is what the mobile targets (later) build against.
[lib]
name = "rimeward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
# tauri enables rt, rt-multi-thread, sync, fs, io-util; the rest is ours.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "net", "time", "macros", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the graph through tauri; the Chromium download streams through it.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }

keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
getrandom = "0.3"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
