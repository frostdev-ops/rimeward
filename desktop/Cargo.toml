[package]
name = "rimeward"
version = "1.0.15"
edition = "2021"
rust-version = "1.98"
description = "Rimeward — standalone development workspaces with live remote access"

# The lib/bin split is what the mobile targets (later) build against.
[lib]
name = "rimeward_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "input-recovery"
path = "tests/input-recovery.rs"
harness = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# macos-private-api: what the overlay pool's transparent slot windows need.
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api"] }
# Reuse Tauri's platform key mapping for browser physical key codes.
tao = { version = "=0.35.3", default-features = false, features = ["serde"] }
tauri-plugin-autostart = "2.5"
# tauri enables rt, rt-multi-thread, sync, fs, io-util; the rest is ours.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "net", "time", "macros", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the graph through tauri; the Chromium download streams through it.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }

keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
getrandom = "0.3"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Self-update (src/updates.rs): signed manifests from the desktop-v* releases,
# discovered through the bundled runtime; the OS notification says one is there.
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
enigo = { version = "=0.6.1", features = ["serde"] }
xcap = "=0.9.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
arboard = "=3.6.1"
cap-std = "=4.0.3"
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
# The overlay's interactive hotkey (Cmd+Shift+L, and Esc while interactive).
# Registered from Rust only, so no capability grants its commands to a page.
tauri-plugin-global-shortcut = "2"
cua-driver-sdk = { git ="https://github.com/trycua/cua", rev = "6c0348b059595e63d1df96e6df2047ca7dbbbf1c" }
platform-macos = { git = "https://github.com/trycua/cua", rev = "6c0348b059595e63d1df96e6df2047ca7dbbbf1c" }
# Already pinned by Cua; the host owns the system sharing menu's lifecycle.
# macos_14_2 is the lens's floor: `with_source_rect` and the dirty-rect
# attachments. The crate gates nothing above what either caller uses.
screencapturekit = { version = "=6.1.0", features = ["macos_14_2"] }
libc = "0.2"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"

# The lens (src/lens). Every objc2 crate is default-features = false with
# exactly the headers it names, because the defaults pull a whole framework;
# all of them are already in Cargo.lock under Tauri's own objc2 stack.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSOperation",
    "NSProcessInfo",
    "NSRange",
    "NSString",
    "NSThread",
    "NSValue",
    "block2",
] }
# The NSWorkspace activation observer is a block, and installing it from a
# command thread hops the main dispatch queue.
block2 = { version = "0.6", default-features = false, features = ["std"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
# CVPixelBuffer: the sample buffer's image buffer feeds VNImageRequestHandler.
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
    "objc2",
] }
# VNRecognizeTextRequest + VNImageRequestHandler (OCR),
# VNGenerateImageFeaturePrintRequest + VNFeaturePrintObservation (change score).
objc2-vision = { version = "=0.3.2", default-features = false, features = [
    "std",
    "VNRequest",
    "VNRequestHandler",
    "VNObservation",
    "VNTypes",
    "VNRecognizeTextRequest",
    "VNGenerateImageFeaturePrintRequest",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-video",
] }
# NSWorkspace activation notifications, NSRunningApplication (bundle, pid),
# NSScreen (display scale).
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    # `libc` is what exposes NSRunningApplication's pid_t accessors.
    "libc",
    "NSApplication",
    # NSColor: an overlay slot window is cleared to transparent.
    "NSColor",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSWindow",
    "NSWorkspace",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "clipboard"] }
reis = "=0.7.1"
libc = "0.2"

[profile.release]
# Thin LTO, default codegen units: a few percent larger binary than fat LTO at
# one unit, minutes less link time on every CI release build. The installer is
# Node + Chromium + GStreamer; the Rust binary's size is noise in it.
lto = "thin"
opt-level = "s"
strip = true
