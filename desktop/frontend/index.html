<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rimeward</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 20%, #10304b, #06121f 70%); color: #e8f2fa; }
      main { box-sizing: border-box; width: min(32rem, 100%); padding: 2rem 1.5rem; text-align: center; }
      h1 { margin: 0 0 2.5rem; color: #6fdcff; font-size: 1.2rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
      #status { margin: 0; font-size: 1.35rem; font-weight: 600; letter-spacing: -.03em; }
      #detail { min-height: 3em; margin: .6rem 0 0; color: #a9bfd0; font-size: .875rem; }
      .progress { height: 2px; margin: 1.5rem auto 0; overflow: hidden; border-radius: 2px; background: #24405f; }
      .progress::before { content: ''; display: block; width: 35%; height: 100%; background: #17c8f4; animation: loading 1.7s ease-in-out infinite alternate; }
      #diagnostic { margin: 1.5rem 0 0; padding: 1rem; border: 1px solid #24405f; border-radius: .75rem; background: #0d1b2e; color: #a9bfd0; font-size: .875rem; }
      code { display: block; margin-top: .75rem; overflow-wrap: anywhere; color: #e8f2fa; font-size: .8rem; }
      main.failed .progress { display: none; }
      @keyframes loading { to { transform: translateX(190%); } }
      @media (prefers-reduced-motion: reduce) { .progress::before { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Rimeward</h1>
      <div role="status" aria-live="polite">
        <p id="status">Opening your workspace…</p>
        <p id="detail">Preparing the application.</p>
      </div>
      <div class="progress" aria-hidden="true"></div>
      <p id="diagnostic" hidden>Diagnostic code<code></code></p>
    </main>
    <script>
      const stages = {
        initializing: 'Preparing the application.',
        files: 'Locating the runtime and your local data.',
        credentials: 'Opening your operating system credential store.',
        port: 'Preparing the local connection.',
        runtime: 'Starting the bundled runtime.',
        backend: 'Loading your local environment.',
        window: 'Opening your workspace.',
        ready: 'Your workspace is ready.',
      };
      const fixes = {
        'credential-access': 'Your operating system denied access to the saved encryption key. Sign in to your normal OS account and check credential-store access, then quit Rimeward from its tray menu and reopen it.',
        'credential-store': 'The operating system could not read or save the encryption key. Keep your existing Rimeward credentials and data; use the diagnostic code below to investigate.',
        'missing-file': 'A required runtime file could not be found. Reinstall Rimeward using the latest installer and check whether your security software quarantined a file.',
        'access-denied': 'The operating system blocked access to a required file or local connection. Check application permissions and your security software.',
        'port-in-use': 'Another program is using Rimeward’s local port. Close it, or wait a moment if Rimeward just restarted, then quit Rimeward from its tray menu and reopen it.',
        'runtime-error': 'The local runtime could not start. Check runtime-diagnostics.jsonl in Rimeward’s application-data folder and share the diagnostic code below.',
      };
      const started = Date.now();
      async function update() {
        try {
          const result = await window.__TAURI__.core.invoke('startup_status');
          document.querySelector('#detail').textContent = result.error ? (fixes[result.error] ?? fixes['runtime-error']) : (stages[result.stage] ?? stages.initializing);
          if (result.error) {
            document.querySelector('main').classList.add('failed');
            document.querySelector('#status').textContent = 'Your local environment could not start.';
            document.querySelector('#diagnostic').hidden = false;
            document.querySelector('code').textContent = `${result.stage} / ${result.error}${result.os_code === null ? '' : ` / OS ${result.os_code}`}`;
            return;
          }
          if (Date.now() - started > 60000) document.querySelector('#status').textContent = 'Startup is taking longer than expected.';
        } catch {
          document.querySelector('#detail').textContent = 'Waiting for the desktop connection. If this persists, quit Rimeward from its tray menu and reopen it.';
        }
        setTimeout(update, 1000);
      }
      update();
    </script>
  </body>
</html>
