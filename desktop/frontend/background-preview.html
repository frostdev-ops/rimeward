<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'self'; script-src 'self'; connect-src ipc: http://ipc.localhost">
<title>Rime · Background app</title>
<link rel="stylesheet" href="background-preview.css">
</head>
<body>
<header><strong id="app">Rime · Background app</strong><span id="mode">Observation preview</span></header>
<main><div id="frame"><img id="image" alt="Last observed app window" hidden><span id="cursor" role="img" aria-label="Rime’s cursor" hidden>↖</span><p id="empty">Waiting for an observation</p></div></main>
<p id="time">No observation yet</p><p id="status" role="status" aria-live="polite">Background session</p>
<footer><button id="pause" type="button">Pause</button><button id="takeover" type="button">Take over</button><button id="stop" type="button">Stop</button></footer>
<script src="background-preview.js"></script>
</body>
</html>
