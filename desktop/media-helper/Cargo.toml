[package]
name = "rimeward-media"
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
gst = { package = "gstreamer", version = "=0.25.3", features = ["v1_28"] }
gst-app = { package = "gstreamer-app", version = "=0.25.2", features = ["v1_28"] }
gst-sdp = { package = "gstreamer-sdp", version = "=0.25.3" }
gst-webrtc = { package = "gstreamer-webrtc", version = "=0.25.2", features = ["v1_28"] }
gstrswebrtc = { package = "gst-plugin-webrtc", version = "=0.15.3", default-features = false }
gstrsrtp = { package = "gst-plugin-rtp", version = "=0.15.3", default-features = false }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=10.0.3", features = ["macos_14_0"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
