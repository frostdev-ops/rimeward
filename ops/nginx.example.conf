# A reverse proxy in front of `node server.mjs` (127.0.0.1:3005).
# Install ops/runtime-relay.nginx.conf at the include path below. Live desktop
# payloads must not enter proxy logs, disk buffers, or persistent caches.
# Certificates: whatever you use (certbot, a Cloudflare origin cert).

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # nginx defaults to 1m: background photos and Notion uploads are 20m each,
    # a multi-file agent attachment post 60m. The app enforces its own limits.
    client_max_body_size 64m;

    # Includes /api/live/stream WebSocket upgrade for shared dashboard events.
    include /etc/nginx/snippets/rimeward-runtime-relay.conf;

    # Agent activity, theme/layout updates, timers, and automation events.
    location /api/logic/stream {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The status stream: open for hours, never buffered.
    location /api/status/stream {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The browser wards' screencast, one stream per visible ward.
    location /api/browser/stream {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The desktop app's tunnel: a websocket that stays up while the app runs.
    location /api/tunnel {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
