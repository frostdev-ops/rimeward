# Include inside the Rimeward server block. The relay must never spill desktop
# payloads (including request URLs, uploads or frames) into logs/cache/temp files.
location ^~ /runtime/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    client_max_body_size 100m;
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    # add_header in a location drops the server-level headers; restate them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /api/devices/connect {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    access_log off;
    error_log /dev/null crit;
}
# A browser ward's frames and input (src/lib/browser/live.ts): binary jpeg
# down, command batches up. `^~` so the /api/browser/ regex below cannot win.
location ^~ /api/browser/ws/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    access_log off;
    error_log /dev/null crit;
}
# Shared authenticated dashboard streams use WebSocket, not HTTP request slots.
location = /api/live/stream {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    access_log off;
    error_log /dev/null crit;
}

# The app persists the authorized Rime journal; proxies must not keep extra copies.
location ^~ /api/devices/harness {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 360s;
    client_max_body_size 65m;
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    # add_header in a location drops the server-level headers; restate them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Automatic ward routing uses the regular API under one dashboard.
location ~ ^/api/(dev/|browser/|note/|agent/|instance/|remote-desktop/) {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    client_max_body_size 100m;
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    # add_header in a location drops the server-level headers; restate them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
