# Rendered by turn-setup.sh; the shared secret is appended only on the server.
listening-port=3478
tls-listening-port=5349
listening-ip=@PUBLIC_IP@
relay-ip=@PUBLIC_IP@
min-port=55000
max-port=55199
realm=turn.frostdev.io
server-name=turn.frostdev.io
fingerprint
use-auth-secret
stale-nonce=600
# Each session has two peers and may gather relay candidates on several interfaces.
user-quota=16
total-quota=128
# Capacity is reserved per ICE allocation, including unused candidate paths.
# 16 Mbps per allocation leaves room for four viewers within the shared budget.
max-bps=2000000
bps-capacity=50000000
max-allocate-lifetime=600
no-tcp-relay
no-dtls
no-tlsv1
no-tlsv1_1
no-cli
no-rfc5780
no-multicast-peers
# Loopback is refused by coturn's default and the explicit address ranges below.
cert=/etc/rimeward/turn-tls/fullchain.pem
pkey=/etc/rimeward/turn-tls/privkey.pem
pidfile=/run/rimeward-turn/turnserver.pid
# Session metadata is retained in Rimeward's bounded audit, not coturn traffic logs.
log-file=/dev/null
simple-log
no-stdout-log
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
# Start at ::1: coturn treats :: as an unbounded endpoint across address families.
denied-peer-ip=::1-1fff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:0:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:2::-2001:2:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:10::-2001:2f:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=3ffe::-3fff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=4000::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
